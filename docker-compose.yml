services:
  api:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    cpus: 1.0
  engenheiro-reverso:
    image: node:22-slim
    working_dir: /app
    volumes: ["./apps/engenheiro-reverso:/app"]
    command: sh -c "npm ci && npm run dev"
    environment:
      FUNNEL_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
